name: arzxsh
options:
  bundleIdPrefix: me.arafatarzu
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: "NO"
targets:
  arzxsh:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Models
      - path: Player
      - path: Views
      - path: Resources
      - path: Shared
      - path: Widgets/WidgetViews.swift
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: arzxsh
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
    entitlements:
      path: App/arzxsh.entitlements
      properties:
        com.apple.security.application-groups:
          - group.me.arafatarzu.arzxsh
    dependencies:
      - target: ArzxshWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.arafatarzu.arzxsh
    scheme:
      testTargets:
        - arzxshUITests
        - arzxshTests
  ArzxshWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
      - path: Models
      - path: Views/CoverArt.swift
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: arzxsh Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/ArzxshWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.me.arafatarzu.arzxsh
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.arafatarzu.arzxsh.widgets
  arzxshUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: arzxsh
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.arafatarzu.arzxshUITests
        TEST_TARGET_NAME: arzxsh
  arzxshTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: arzxsh
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.arafatarzu.arzxshTests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/arzxsh.app/arzxsh
        BUNDLE_LOADER: $(TEST_HOST)
